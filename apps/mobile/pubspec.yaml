name: quikfly
description: "QuikFly: bike taxi, cab, bus, holidays and rentals. Android app on the QuikFly API."
publish_to: 'none'
version: 0.1.6+7

environment:
  sdk: ^3.13.7

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  image_picker: ^1.2.4
  intl: ^0.20.3
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  # Two Android apps (see android/app/build.gradle.kts): the customer app builds by default.
  default-flavor: customer
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/services/
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
    - family: ArchivoBlack
      fonts:
        - asset: assets/fonts/ArchivoBlack-Regular.ttf

# dart run flutter_launcher_icons  (after changing assets/icon/)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#07070A"
  adaptive_icon_foreground: assets/icon/icon-foreground.png
  min_sdk_android: 21
